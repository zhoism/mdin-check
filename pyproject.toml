[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mdin-check"
version = "0.1.0"
description = "Catch Amber sander/pmemd input mistakes - including the ones the engine runs without complaint - before they cost a simulation."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
mdin-check = "mdin_check.cli:main"

[tool.setuptools]
packages = ["mdin_check"]

[tool.setuptools.package-data]
mdin_check = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
